<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Scene not found - Panos Kikas</title>
	<!-- GitHub Pages serves this for any missing path, so every URL here is root-absolute -->
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
	<style>
		:root {
			--scene: #1a1b26;
			--panel: #1f2335;
			--raised: #292e42;
			--hover: #343a55;
			--line: #2f3449;
			--text: #f4f6ff;
			--text-2: #c9cee8;
			--text-dim: #8e95bb;
			--accent: #6c7fe8;
			--red: #f7768e;
			--mono: 'JetBrains Mono', Consolas, monospace;
		}
		* { box-sizing: border-box; }
		html, body { margin: 0; min-height: 100%; }
		body {
			display: flex;
			flex-direction: column;
			min-height: 100vh;
			background: var(--scene);
			color: var(--text);
			font: 400 15px/1.5 'Inter', system-ui, sans-serif;
		}
		.toolbar {
			display: flex;
			align-items: center;
			gap: 4px;
			height: 36px;
			padding: 0 10px;
			background: var(--panel);
			border-bottom: 1px solid #13141c;
			font-size: 12px;
		}
		.tab { padding: 5px 12px; border-radius: 3px; color: var(--text-dim); }
		.tab.active { background: var(--raised); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
		.scene {
			position: relative;
			flex: 1;
			display: grid;
			place-items: center;
			padding: 32px 16px;
			overflow: hidden;
			background:
				radial-gradient(ellipse 45% 40% at 50% 50%, rgba(122, 162, 247, 0.12) 0%, transparent 70%),
				radial-gradient(ellipse 50% 45% at 18% 15%, rgba(187, 154, 247, 0.09) 0%, transparent 70%),
				radial-gradient(ellipse 80% 70% at 50% 45%, #1f2233 0%, var(--scene) 100%);
		}
		.scene::before {
			content: '';
			position: absolute;
			inset: 0;
			background:
				linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px) 0 0 / 100px 100px,
				linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px) 0 0 / 100px 100px,
				linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px) 0 0 / 20px 20px,
				linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px) 0 0 / 20px 20px;
			-webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 35%, transparent 100%);
			mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 35%, transparent 100%);
		}
		.panel {
			position: relative;
			width: min(560px, 100%);
			background: linear-gradient(180deg, rgba(36, 40, 59, 0.92) 0%, rgba(26, 27, 38, 0.94) 100%);
			border: 1px solid rgba(255, 255, 255, 0.09);
			border-radius: 6px;
			box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 0 90px rgba(122, 162, 247, 0.1);
			text-align: center;
		}
		.titlebar {
			display: flex;
			align-items: center;
			gap: 8px;
			height: 30px;
			padding: 0 16px;
			background: rgba(255, 255, 255, 0.03);
			border-bottom: 1px solid rgba(255, 255, 255, 0.09);
			font: 500 11.5px/1 var(--mono);
			color: var(--text-dim);
			text-align: left;
		}
		.titlebar::before {
			content: '';
			width: 6px;
			height: 6px;
			background: var(--red);
			transform: rotate(45deg);
		}
		.body { padding: 34px 40px 38px; }
		.code { font: 500 14px var(--mono); color: var(--text-dim); }
		h1 {
			margin: 6px 0 12px;
			font-size: clamp(34px, 7vw, 52px);
			font-weight: 800;
			letter-spacing: -0.025em;
			line-height: 1.05;
		}
		p { margin: 0 auto; max-width: 40ch; color: var(--text-2); }
		.console {
			margin: 22px 0 26px;
			padding: 10px 14px;
			background: var(--scene);
			border: 1px solid var(--line);
			border-radius: 6px;
			font: 400 12.5px/1.6 var(--mono);
			color: var(--text-dim);
			text-align: left;
			overflow-wrap: anywhere;
		}
		.console .err { color: var(--red); }
		.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
		.btn {
			display: inline-flex;
			align-items: center;
			padding: 12px 24px;
			border-radius: 6px;
			font-weight: 600;
			text-decoration: none;
			transition: background-color 0.12s;
		}
		.btn-primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
		.btn-primary:hover { background: #7d8ef0; }
		.btn-secondary { background: var(--raised); color: var(--text); border: 1px solid var(--line); }
		.btn-secondary:hover { background: var(--hover); }
		.btn:focus-visible { outline: 2px solid #7dcfff; outline-offset: 3px; }
		@media (max-width: 480px) { .body { padding: 26px 20px 30px; } }
	</style>
</head>
<body>
	<div class="toolbar" aria-hidden="true">
		<span class="tab active">Scene</span>
		<span class="tab">Game</span>
	</div>
	<main class="scene">
		<div class="panel">
			<div class="titlebar">Missing Scene</div>
			<div class="body">
				<div class="code">Error 404</div>
				<h1>Scene not found</h1>
				<p>This page isn't in the build. It may have moved, or the link has a typo.</p>
				<div class="console" aria-label="Error details">
					<span class="err">✖ SceneManager.LoadScene</span>(<span id="path">"/"</span>) failed:<br>
					no scene with that path exists in the build settings.
				</div>
				<div class="actions">
					<a class="btn btn-primary" href="/">Back to Home</a>
					<a class="btn btn-secondary" href="/portfolio.html">View Portfolio</a>
				</div>
			</div>
		</div>
	</main>
	<script>
		document.getElementById('path').textContent = JSON.stringify(location.pathname);
	</script>
</body>
</html>
